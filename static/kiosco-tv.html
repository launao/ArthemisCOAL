<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthemis Health — Sala de Espera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/arthemis-theme.css">
<style>
  :root {
    --dark-bg: #0D2137;
    --card-bg: #1A3550;
    --card-bg-2: #163049;
    --primary: #00B0A6;
    --primary-2: #14C8BC;
    --orange: #FF8A3D;
    --text: #FFFFFF;
    --text-dim: #9FB3C8;
    --border: rgba(255,255,255,0.08);
    --success: #35D07F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; }

  body {
    font-family: 'DM Sans', Arial, sans-serif;
    background: var(--dark-bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ===================== HEADER ===================== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 18px; }
  .logo-wrap {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 26px; color: #fff;
    flex-shrink: 0; overflow: hidden;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .clinic-name { font-size: 26px; font-weight: 800; letter-spacing: 0.5px; }
  .clinic-sub { font-size: 13px; font-weight: 600; letter-spacing: 3px; color: var(--primary-2); margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 28px; }
  .clock-wrap { text-align: right; }
  .clock-time { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .clock-date { font-size: 13px; color: var(--text-dim); text-transform: capitalize; margin-top: 2px; }
  .sse-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 8px var(--success);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .sse-dot.offline { background: #E14F4F; box-shadow: 0 0 8px #E14F4F; }

  /* ===================== MAIN — CALLING DISPLAY ===================== */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    min-height: 0;
    overflow: hidden;
  }

  .calling-card {
    width: 100%; max-width: 900px;
    background: var(--card-bg);
    border-radius: 32px;
    border: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 40px;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
  }

  .calling-card.active {
    background: linear-gradient(160deg, var(--card-bg) 0%, rgba(0,176,166,0.18) 100%);
    border-color: var(--primary);
    box-shadow: 0 0 80px rgba(0,176,166,0.15);
  }

  .calling-card.flash { animation: flashBg 0.85s ease-in-out 3; }
  @keyframes flashBg {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .calling-label {
    font-size: 18px; font-weight: 800; letter-spacing: 6px;
    color: var(--primary-2); margin-bottom: 20px;
  }
  .calling-turno {
    font-size: 120px; font-weight: 900; line-height: 1; letter-spacing: 4px;
    color: #fff; text-shadow: 0 0 60px rgba(0,176,166,0.5);
  }
  .calling-name {
    font-size: 28px; font-weight: 600; color: var(--text); margin-top: 28px;
  }
  .calling-destino {
    font-size: 22px; font-weight: 700; color: var(--primary-2);
    margin-top: 16px; letter-spacing: 1px;
  }
  .calling-destino-arrow {
    display: inline-block; margin-right: 8px; font-size: 24px;
    animation: arrowPulse 1.2s ease-in-out infinite;
  }
  @keyframes arrowPulse {
    0%, 100% { opacity: 1; transform: translateX(0); }
    50% { opacity: 0.6; transform: translateX(6px); }
  }
  .calling-count {
    font-size: 14px; font-weight: 600; color: var(--text-dim);
    margin-top: 12px; letter-spacing: 1px; opacity: 0.7;
  }
  .calling-priority-badge {
    margin-top: 20px;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--orange); color: #fff;
    font-size: 14px; font-weight: 800; letter-spacing: 2px;
    padding: 10px 24px; border-radius: 24px;
  }
  .calling-empty-icon { font-size: 80px; opacity: 0.2; margin-bottom: 24px; }
  .calling-empty-text { font-size: 28px; font-weight: 700; color: var(--text-dim); }
  .calling-empty-sub { font-size: 16px; color: var(--text-dim); opacity: 0.5; margin-top: 10px; }

  /* ===================== RECENT CALLS (small strip below main) ===================== */
  .recent-strip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 40px;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    overflow-x: auto;
    min-height: 52px;
  }
  .recent-strip:empty { display: none; }
  .recent-label {
    font-size: 11px; font-weight: 800; letter-spacing: 2px;
    color: var(--text-dim); opacity: 0.5; white-space: nowrap; flex-shrink: 0;
  }
  .recent-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--card-bg-2); border-radius: 10px;
    padding: 6px 14px; opacity: 0.45; white-space: nowrap; flex-shrink: 0;
  }
  .recent-turno { font-size: 16px; font-weight: 900; }
  .recent-name { font-size: 12px; color: var(--text-dim); }
  .recent-check { color: var(--success); font-size: 14px; }

  /* ===================== ADS STRIP ===================== */
  .ads-strip {
    flex-shrink: 0;
    display: none;
    align-items: center;
    gap: 22px;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 16px 40px;
  }
  .ads-strip.visible { display: flex; }
  .ads-icon { font-size: 24px; flex-shrink: 0; }
  .ads-content { flex: 1; overflow: hidden; }
  .ads-title { font-size: 15px; font-weight: 800; color: var(--primary-2); }
  .ads-desc { font-size: 13px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ads-dots { display: flex; gap: 6px; flex-shrink: 0; }
  .ads-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
  .ads-dot.active { background: var(--primary); }

  @media (max-width: 800px) {
    .calling-turno { font-size: 72px; }
    .calling-name { font-size: 20px; }
    .calling-destino { font-size: 16px; }
    main { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-wrap" id="logoWrap">AH</div>
    <div>
      <div class="clinic-name" id="clinicName">Arthemis Health</div>
      <div class="clinic-sub" id="clinicSub">SALA DE ESPERA</div>
    </div>
  </div>
  <div class="header-right">
    <span class="sse-dot" id="sseDot" title="Estado de conexión"></span>
    <div class="clock-wrap">
      <div class="clock-time" id="clockTime">00:00:00</div>
      <div class="clock-date" id="clockDate">-</div>
    </div>
  </div>
</header>

<main>
  <div class="calling-card" id="callingCard">
    <div class="calling-empty-icon">🔔</div>
    <div class="calling-empty-text">Sin llamados activos</div>
    <div class="calling-empty-sub">Los turnos llamados aparecerán aquí</div>
  </div>
</main>

<div class="recent-strip" id="recentStrip"></div>

<div class="ads-strip" id="adsStrip">
  <div class="ads-icon">📢</div>
  <div class="ads-content">
    <div class="ads-title" id="adsTitle"></div>
    <div class="ads-desc" id="adsDesc"></div>
  </div>
  <div class="ads-dots" id="adsDots"></div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    config: null,
    cola: [],
    anuncios: [],
    currentAdIndex: 0,
    adTimer: null,
    lastAnnouncedId: null,
    sse: null,
    pollTimer: null,
    sseConnected: false
  };

  var API_CONFIG = '/api/kiosco/config';
  var API_COLA = '/api/kiosco/cola';
  var API_ANUNCIOS = '/api/kiosco/anuncios';
  var API_SSE = '/api/sse';

  // Detect mode from URL: /kiosco/tv/urgencias → 'urgencias'
  var MODO = (function(){
    var m = window.location.pathname.match(/^\/kiosco\/tv\/([^\/]+)$/);
    return m ? m[1] : '';
  })();

  if (MODO) {
    API_COLA = API_COLA + '?modo=' + encodeURIComponent(MODO);
  }

  function el(id) { return document.getElementById(id); }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ===================== CLOCK =====================
  function updateClock() {
    var now = new Date();
    el('clockTime').textContent = now.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    el('clockDate').textContent = now.toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long' });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===================== CONFIG =====================
  function loadConfig() {
    fetch(API_CONFIG)
      .then(function(r){ return r.json(); })
      .then(function(data){
        var branding = (data && data.branding) || {};
        state.config = data;
        applyBranding(branding);
      })
      .catch(function(err){ console.error('Error config:', err); });
  }

  function applyBranding(b) {
    var root = document.documentElement.style;
    if (b.darkBg) root.setProperty('--dark-bg', b.darkBg);
    if (b.primaryColor) {
      root.setProperty('--primary', b.primaryColor);
      root.setProperty('--primary-2', b.primaryColor);
    }
    if (b.clinicName) {
      el('clinicName').textContent = b.clinicName;
      document.title = b.clinicName + ' — Sala de Espera';
    }
    var logoWrap = el('logoWrap');
    var logoUrl = b.logo || b.logo_url;
    if (logoUrl) {
      logoWrap.innerHTML = '<img src="' + escapeHtml(logoUrl) + '" alt="Logo" onerror="this.parentNode.textContent=\'AH\';">';
    }
    // Show modo in subtitle
    if (MODO) {
      var label = MODO.charAt(0).toUpperCase() + MODO.slice(1).replace(/-/g, ' ');
      el('clinicSub').textContent = 'SALA DE ESPERA — ' + label.toUpperCase();
      document.title = (b.clinicName || 'Arthemis Health') + ' — ' + label;
    }
  }

  // ===================== COLA =====================
  function fetchCola() {
    return fetch(API_COLA)
      .then(function(r){ return r.json(); })
      .then(function(data){
        state.cola = (data && data.cola) || [];
        renderDisplay();
      })
      .catch(function(err){ console.error('Error cola:', err); });
  }

  function renderDisplay() {
    renderCalling();
    renderRecent();
  }

  function renderCalling() {
    var card = el('callingCard');
    var llamando = state.cola.filter(function(t){ return t.estado === 'llamando'; });
    llamando.sort(function(a,b){
      return new Date(b.fecha_llamado||0) - new Date(a.fecha_llamado||0);
    });
    var current = llamando[0];

    if (!current) {
      card.className = 'calling-card';
      card.innerHTML =
        '<div class="calling-empty-icon">🔔</div>' +
        '<div class="calling-empty-text">Sin llamados activos</div>' +
        '<div class="calling-empty-sub">Los turnos llamados aparecerán aquí</div>';
      return;
    }

    card.className = 'calling-card active';

    var destino = current.destino || current.modulo || '';
    var destinoHtml = destino
      ? '<div class="calling-destino"><span class="calling-destino-arrow">➜</span>Diríjase a ' + escapeHtml(destino) + '</div>'
      : '';

    var countNum = current.llamado_count || 1;
    var countHtml = countNum > 1
      ? '<div class="calling-count">Llamado ' + countNum + ' de 3</div>'
      : '';

    var priorityHtml = (current.turno_tipo === 'preferencial' || current.prioritario)
      ? '<div class="calling-priority-badge">PRIORITARIO</div>'
      : '';

    card.innerHTML =
      '<div class="calling-label">TURNO</div>' +
      '<div class="calling-turno">' + escapeHtml(current.turno) + '</div>' +
      '<div class="calling-name">' + escapeHtml(current.nombre || 'Paciente') + '</div>' +
      destinoHtml + countHtml + priorityHtml;
  }

  function renderRecent() {
    var atendidos = state.cola.filter(function(t){ return t.estado === 'atendido'; });
    atendidos.sort(function(a,b){
      return new Date(b.fecha_llamado||b.creado_en||0) - new Date(a.fecha_llamado||a.creado_en||0);
    });
    var recent = atendidos.slice(0, 5);
    var strip = el('recentStrip');

    if (recent.length === 0) {
      strip.innerHTML = '';
      return;
    }

    var html = '<span class="recent-label">ÚLTIMOS ATENDIDOS</span>';
    for (var i = 0; i < recent.length; i++) {
      var t = recent[i];
      html += '<div class="recent-item">' +
        '<span class="recent-turno">' + escapeHtml(t.turno) + '</span>' +
        '<span class="recent-name">' + escapeHtml(t.nombre || '') + '</span>' +
        '<span class="recent-check">✓</span></div>';
    }
    strip.innerHTML = html;
  }

  // ===================== SPEECH (3 calls) =====================
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-CO';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    } catch(e) { console.error('Speech error:', e); }
  }

  function announceTurn(turnoData) {
    var code = turnoData.turno || '';
    var name = turnoData.nombre || 'paciente';
    var destino = turnoData.destino || '';
    var text = 'Turno ' + code + ', ' + name;
    if (destino) text += ', diríjase a ' + destino;
    else text += ', por favor acérquese';

    // Announce 3 times with pauses
    speak(text);
    setTimeout(function(){ speak(text); }, 3000);
    setTimeout(function(){ speak(text); }, 6000);
  }

  function flashCallingCard() {
    var card = el('callingCard');
    card.classList.remove('flash');
    void card.offsetWidth;
    card.classList.add('flash');
    setTimeout(function(){ card.classList.remove('flash'); }, 2600);
  }

  // ===================== SSE =====================
  function setSseStatus(connected) {
    state.sseConnected = connected;
    el('sseDot').classList.toggle('offline', !connected);
  }

  function connectSSE() {
    if (!('EventSource' in window)) { setSseStatus(false); return; }
    try { state.sse = new EventSource(API_SSE); }
    catch(e) { setSseStatus(false); scheduleReconnect(); return; }

    state.sse.onopen = function(){ setSseStatus(true); };
    state.sse.onmessage = function(evt){ handleSseMessage(evt); };
    state.sse.onerror = function(){
      setSseStatus(false);
      if (state.sse) { state.sse.close(); state.sse = null; }
      scheduleReconnect();
    };
  }

  var reconnectTimer = null;
  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function(){ reconnectTimer = null; connectSSE(); }, 4000);
  }

  function handleSseMessage(evt) {
    var payload;
    try { payload = JSON.parse(evt.data); } catch(e) { return; }
    if (!payload || !payload.tipo) return;

    switch (payload.tipo) {
      case 'nuevo_turno':
      case 'turno_atendido':
      case 'triage_asignado':
      case 'turno_admision':
        fetchCola();
        break;
      case 'llamar_turno':
        fetchCola().then(function(){
          flashCallingCard();
          // Announce with destino info from SSE payload
          var announceData = {
            turno: payload.turno || '',
            nombre: payload.nombre || '',
            destino: payload.destino || ''
          };
          // Fallback: find from cola if payload is sparse
          if (!announceData.turno && payload.id) {
            for (var i = 0; i < state.cola.length; i++) {
              if (String(state.cola[i].id) === String(payload.id)) {
                announceData = state.cola[i];
                break;
              }
            }
          }
          announceTurn(announceData);
        });
        break;
    }
  }

  // ===================== POLLING =====================
  function startPolling() {
    if (state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer = setInterval(fetchCola, 15000);
  }

  // ===================== ANUNCIOS =====================
  function loadAnuncios() {
    fetch(API_ANUNCIOS)
      .then(function(r){ return r.json(); })
      .then(function(data){
        state.anuncios = ((data && data.anuncios) || []).filter(function(a){ return a.activo !== false; });
        setupAdsCarousel();
      })
      .catch(function(err){ console.error('Error anuncios:', err); });
  }

  function setupAdsCarousel() {
    var strip = el('adsStrip');
    var dotsWrap = el('adsDots');
    if (!state.anuncios.length) { strip.classList.remove('visible'); return; }

    strip.classList.add('visible');
    state.currentAdIndex = 0;
    var dotsHtml = '';
    for (var i = 0; i < state.anuncios.length; i++) {
      dotsHtml += '<span class="ads-dot' + (i===0?' active':'') + '"></span>';
    }
    dotsWrap.innerHTML = dotsHtml;
    renderCurrentAd();

    var sec = (state.config && state.config.adRotationSeconds) || 6;
    if (state.adTimer) clearInterval(state.adTimer);
    if (state.anuncios.length > 1) {
      state.adTimer = setInterval(function(){
        state.currentAdIndex = (state.currentAdIndex + 1) % state.anuncios.length;
        renderCurrentAd();
      }, sec * 1000);
    }
  }

  function renderCurrentAd() {
    var ad = state.anuncios[state.currentAdIndex];
    if (!ad) return;
    el('adsTitle').textContent = ad.titulo || '';
    el('adsDesc').textContent = ad.descripcion || '';
    var dots = document.querySelectorAll('.ads-dot');
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('active', i === state.currentAdIndex);
  }

  // ===================== INIT =====================
  function init() {
    loadConfig();
    loadAnuncios();
    fetchCola();
    connectSSE();
    startPolling();
    if (MODO) {
      var label = MODO.charAt(0).toUpperCase() + MODO.slice(1).replace(/-/g,' ');
      el('clinicSub').textContent = 'SALA DE ESPERA — ' + label.toUpperCase();
    }
  }

  document.addEventListener('DOMContentLoaded', init);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') {
      fetchCola();
      if (!state.sseConnected) connectSSE();
    }
  });
})();
</script>

<!-- Theme Toggle -->
<button class="theme-toggle" onclick="(function(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);localStorage.setItem('arthemis-theme',t);})()" title="Cambiar tema">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
<script>
(function(){var t=localStorage.getItem('arthemis-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
</script>
</body>
</html>
