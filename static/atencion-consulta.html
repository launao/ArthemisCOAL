<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthemis Health · Consultorio Médico</title>
<style>
:root {
  --primary: #5147C4; --accent: #7269D8; --bg: #FAF8F4; --dark: #1C1916;
  --white: #FFFFFF; --iv2: #F2EFE9; --line: #E6E1D8; --line2: #D8D2C7;
  --ink: #1C1916; --ink2: #3D3834; --ink3: #6B6460; --ink4: #A09890;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --triage-i: #DC2626; --triage-ii: #EA580C; --triage-iii: #D97706; --triage-iv: #16A34A; --triage-v: #2563EB;
  --success: #16A34A; --danger: #DC2626; --warning: #D97706;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--bg); }
button, input, textarea, select { font-family: var(--font); }
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.screen { display: none; width: 100%; height: 100%; }
.screen.active { display: flex; }

/* LOGIN */
#loginScreen { align-items: center; justify-content: center;
  background: linear-gradient(160deg, var(--dark) 0%, #2A2520 50%, #3F37A0 100%); }
.login-card { background: var(--white); border-radius: 16px; padding: 44px 40px; width: 100%; max-width: 380px; box-shadow: 0 4px 40px rgba(0,0,0,.2); }
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.logo-icon { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; }
.login-title { font-size: 20px; font-weight: 700; }
.login-sub { color: var(--ink3); font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--ink3); margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: var(--bg); }
.btn-primary { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; color: #fff; background: var(--primary); cursor: pointer; }
.btn-primary:hover { background: var(--accent); }
.btn-primary:disabled { opacity: .5; }
.login-error { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; text-align: center; }

/* PUESTO */
#puestoScreen { flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.puesto-title { font-size: 20px; font-weight: 700; }
.puesto-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; padding: 20px; }
.puesto-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 32px; background: var(--white); border: 2px solid var(--line); border-radius: 16px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--ink); transition: all .2s; }
.puesto-btn:hover { border-color: var(--primary); background: #F3F1FF; }

/* HEADER */
.header { display: flex; align-items: center; padding: 0 20px; height: 56px; background: var(--white); border-bottom: 1px solid var(--line); gap: 14px; flex-shrink: 0; }
.hdr-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(145deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #fff; }
.hdr-title { font-size: 15px; font-weight: 700; }
.hdr-badge { background: var(--success); color: #fff; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.hdr-spacer { flex: 1; }
.hdr-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink3); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.status-dot.disconnected { background: var(--danger); }
.btn-logout { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); font-size: 13px; color: var(--ink3); cursor: pointer; }
.btn-logout:hover { border-color: var(--danger); color: var(--danger); }

/* LAYOUT */
#mainScreen { flex-direction: column; }
.main-body { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 280px; border-right: 1px solid var(--line); background: var(--white); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.sidebar-title { font-size: 14px; font-weight: 700; }
.queue-count { background: var(--primary); color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; }
.queue-list { flex: 1; overflow-y: auto; padding: 8px; }
.q-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 6px; cursor: default; transition: background .15s; }
.q-card:hover { background: var(--iv2); }
.q-turno { font-weight: 700; font-size: 15px; color: var(--primary); min-width: 44px; }
.q-info { flex: 1; min-width: 0; }
.q-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-meta { display: flex; gap: 6px; margin-top: 3px; align-items: center; }
.q-wait { font-size: 10px; color: var(--ink4); }
.triage-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700; color: #fff; }
.triage-I { background: var(--triage-i); } .triage-II { background: var(--triage-ii); } .triage-III { background: var(--triage-iii); }
.triage-IV { background: var(--triage-iv); } .triage-V { background: var(--triage-v); }
.queue-empty { padding: 32px; text-align: center; color: var(--ink4); font-size: 13px; }

/* WORKSPACE */
.workspace { flex: 1; overflow-y: auto; padding: 20px; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; }
.btn-siguiente { padding: 16px 48px; font-size: 18px; font-weight: 700; border: none; border-radius: 14px; background: var(--primary); color: #fff; cursor: pointer; transition: background .15s; }
.btn-siguiente:hover { background: var(--accent); }
.btn-siguiente:disabled { opacity: .4; cursor: not-allowed; }
.empty-hint { color: var(--ink4); font-size: 13px; }

/* Patient header */
.patient-header { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; }
.pat-turno { font-size: 24px; font-weight: 800; color: var(--primary); }
.pat-info { flex: 1; }
.pat-name { font-size: 16px; font-weight: 700; }
.pat-doc { font-size: 13px; color: var(--ink3); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.pat-actions-top { display: flex; gap: 8px; }
.btn-sm { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); font-size: 12px; cursor: pointer; color: var(--ink3); transition: all .15s; }
.btn-sm:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

/* Sections */
.section-card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--ink2); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .5px; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.info-item label { display: block; font-size: 11px; font-weight: 600; color: var(--ink4); text-transform: uppercase; letter-spacing: .3px; }
.info-value { font-size: 14px; font-weight: 600; color: var(--ink); }
.fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.field-item label { display: block; font-size: 12px; font-weight: 600; color: var(--ink3); margin-bottom: 4px; }
.field-item input, .field-item select, .field-item textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: var(--bg); transition: border-color .15s; }
.field-item input:hover, .field-item select:hover, .field-item textarea:hover { border-color: var(--line2); }
.field-item textarea { min-height: 70px; resize: vertical; }
.field-full { grid-column: 1 / -1; }

/* Triage summary */
.triage-summary { display: flex; gap: 12px; flex-wrap: wrap; }
.triage-stat { text-align: center; padding: 10px 16px; background: var(--iv2); border-radius: 10px; min-width: 80px; }
.triage-stat-value { font-size: 20px; font-weight: 800; color: var(--primary); }
.triage-stat-label { font-size: 11px; color: var(--ink4); margin-top: 2px; }

/* Tabs — pill bar */
.tab-bar { display: flex; gap: 4px; margin-bottom: 16px; background: var(--iv2); border-radius: 12px; padding: 4px; overflow-x: auto; }
.tab-btn { padding: 10px 16px; border: none; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink4); cursor: pointer; white-space: nowrap; transition: all .15s; }
.tab-btn:hover { color: var(--ink2); }
.tab-btn.active { background: var(--white); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Submit bars */
.submit-bar { display: flex; gap: 12px; padding: 16px 20px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; align-items: center; flex-wrap: wrap; }
.btn-action { padding: 12px 28px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; transition: background .15s; display: inline-flex; align-items: center; gap: 8px; }
.btn-action.primary { background: var(--primary); }
.btn-action.primary:hover { background: var(--accent); }
.btn-action.success { background: var(--success); }
.btn-action.success:hover { background: #15803D; }
.btn-action.warning { background: var(--warning); }
.btn-action.warning:hover { background: #B45309; }
.btn-action.outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-action.outline:hover { background: #F3F1FF; }
.btn-action.outline-danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
.btn-action:disabled { opacity: .4; cursor: not-allowed; }

/* Vitals compact grid */
.vitals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.vitals-grid .field-item { min-width: 0; }

/* Order / IC / Rx cards */
.record-card { background: var(--iv2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
.record-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.record-card-title { font-size: 14px; font-weight: 700; color: var(--ink); }
.record-card-meta { font-size: 12px; color: var(--ink4); }
.record-card-body { font-size: 13px; color: var(--ink2); line-height: 1.5; }
.record-card-body p { margin-bottom: 4px; }

/* Status badges */
.estado-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 6px; text-transform: uppercase; }
.estado-solicitada { background: #FEF3C7; color: #92400E; }
.estado-aceptada { background: #DBEAFE; color: #1E40AF; }
.estado-en_proceso { background: #FFEDD5; color: #9A3412; }
.estado-con_resultado { background: #DCFCE7; color: #166534; }
.estado-respondida { background: #DCFCE7; color: #166534; }
.estado-cancelada { background: #F3F4F6; color: #6B7280; }

/* Evolution entries */
.evol-entry { background: var(--iv2); border-left: 3px solid var(--primary); border-radius: 0 10px 10px 0; padding: 14px 16px; margin-bottom: 10px; }
.evol-entry-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.evol-entry-time { font-size: 12px; font-weight: 700; color: var(--primary); }
.evol-entry-doctor { font-size: 12px; color: var(--ink4); }
.evol-entry-body { font-size: 13px; color: var(--ink2); line-height: 1.55; }
.evol-entry-body strong { color: var(--ink); font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }

/* Print buttons */
.print-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn-print { padding: 10px 20px; border: 1.5px solid var(--primary); border-radius: 10px; background: var(--white); color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
.btn-print:hover { background: #F3F1FF; }

/* Radio group */
.radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
.radio-opt { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: var(--ink2); }
.radio-opt input[type="radio"] { accent-color: var(--primary); }

/* Empty list */
.list-empty { padding: 24px; text-align: center; color: var(--ink4); font-size: 13px; }

/* Prescriptions table */
.rx-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rx-table th { text-align: left; padding: 8px 10px; background: var(--iv2); font-size: 11px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .3px; border-bottom: 1px solid var(--line); }
.rx-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--ink2); }
.rx-table tr:last-child td { border-bottom: none; }
.rx-table .rx-med { font-weight: 600; color: var(--ink); }

/* HC info banner */
.hc-banner { padding: 12px 16px; background: #F0EFFF; border: 1px solid var(--accent); border-radius: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.hc-banner-icon { font-size: 18px; }
.hc-banner-text { font-size: 13px; font-weight: 600; color: var(--primary); }

/* Toast */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #fff; opacity: 0; transition: all .3s; z-index: 9999; pointer-events: none; max-width: 420px; text-align: center; }
.toast.info { background: var(--primary); } .toast.success { background: var(--success); } .toast.error { background: var(--danger); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; }
.spinner.dark { border-color: rgba(0,0,0,.15); border-top-color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Separator */
.sep { height: 1px; background: var(--line); margin: 16px 0; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid var(--line); }
  .main-body { flex-direction: column; }
  .tab-bar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .vitals-grid { grid-template-columns: repeat(2, 1fr); }
  .patient-header { flex-direction: column; text-align: center; }
  .pat-actions-top { justify-content: center; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="loginScreen">
  <div class="login-card">
    <div class="login-logo"><div class="logo-icon">A</div><div class="login-title">Arthemis Health</div></div>
    <div class="login-sub">Consultorio Medico - Urgencias</div>
    <form id="loginForm">
      <div class="form-group"><label>Usuario</label><input type="text" id="usuario" required autocomplete="username"></div>
      <div class="form-group"><label>Contrasena</label><input type="password" id="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn-primary" id="loginBtn">Iniciar sesion</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- PUESTO -->
<div class="screen" id="puestoScreen">
  <div class="puesto-title">Seleccionar Consultorio</div>
  <div class="puesto-grid" id="puestoGrid"></div>
</div>

<!-- MAIN -->
<div class="screen" id="mainScreen">
  <div class="header">
    <div class="hdr-mark">A</div>
    <div class="hdr-title">Consultorio Medico</div>
    <div class="hdr-badge">Urgencias</div>
    <div class="hdr-spacer"></div>
    <div class="hdr-meta">
      <span id="hdrPuesto"></span><span>|</span>
      <span id="hdrUser"></span><span>|</span>
      <span id="hdrClock">--:--:--</span>
      <div class="status-dot" id="statusDot"></div>
    </div>
    <button class="btn-logout" id="btnLogout">Salir</button>
  </div>
  <div class="main-body">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Cola admitidos</div>
        <div class="queue-count" id="queueCount">0</div>
      </div>
      <div class="queue-list" id="queueList"><div class="queue-empty">No hay pacientes</div></div>
    </div>
    <div class="workspace" id="workspace"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
'use strict';

/* ── STATE ── */
let user = null, puesto = null, actual = null, cola = [];
let triageData = null, hcId = null, hcData = null;
let evtSource = null, pollTimer = null, clockTimer = null;
let localPrescripciones = [];
let activeTab = 'triage';

const TRIAGE = {
  I:  { label: 'Resucitacion', color: 'var(--triage-i)' },
  II: { label: 'Emergencia',   color: 'var(--triage-ii)' },
  III:{ label: 'Urgencia',     color: 'var(--triage-iii)' },
  IV: { label: 'Prioritaria',  color: 'var(--triage-iv)' },
  V:  { label: 'No urgente',   color: 'var(--triage-v)' },
};

/* ── UTILS ── */
function esc(s) { if (s == null) return ''; var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function showScreen(id) { document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); }); document.getElementById(id).classList.add('active'); }
function toast(msg, type) {
  type = type || 'info';
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + type + ' show';
  clearTimeout(el._t); el._t = setTimeout(function() { el.classList.remove('show'); }, 3500);
}

function setBtn(btn, loading, text) {
  if (!btn) return;
  btn.disabled = loading;
  if (loading) btn.innerHTML = '<span class="spinner"></span> ' + (text || '');
  else btn.textContent = text || '';
}

function fmtDateTime(s) {
  if (!s) return '';
  try { var d = new Date(s); return d.toLocaleDateString('es-CO') + ' ' + d.toLocaleTimeString('es-CO', {hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return s; }
}

async function api(method, path, body) {
  var opts = { method: method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' };
  if (body !== undefined) opts.body = JSON.stringify(body);
  var res = await fetch(path, opts);
  if (!res.ok) {
    var d = {};
    try { d = await res.json(); } catch(e) {}
    throw new Error(d.error || d.detail || 'Error ' + res.status);
  }
  if (res.status === 204) return {};
  return res.json();
}

/* ── CLOCK ── */
function startClock() {
  function tick() {
    var n = new Date();
    document.getElementById('hdrClock').textContent =
      [n.getHours(), n.getMinutes(), n.getSeconds()].map(function(v){ return String(v).padStart(2,'0'); }).join(':');
  }
  tick(); clockTimer = setInterval(tick, 1000);
}

/* ── AUDIO ── */
function playNotif() {
  try {
    var c = new (window.AudioContext || window.webkitAudioContext)();
    var o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'sine'; o.frequency.value = 660; g.gain.value = 0.12;
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.4);
    o.stop(c.currentTime + 0.4);
  } catch(e) {}
}

/* ══════════════════════════════════════════
   AUTH
   ══════════════════════════════════════════ */
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var err = document.getElementById('loginError'); err.style.display = 'none';
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    var data = await api('POST', '/api/auth/login', {
      usuario: document.getElementById('usuario').value,
      password: document.getElementById('password').value
    });
    user = data.user || data;
    await checkPuesto();
  } catch(ex) { err.textContent = ex.message; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Iniciar sesion'; }
});

async function checkPuesto() {
  try {
    var d = await api('GET', '/api/atencion/mi-puesto');
    if (d && d.puesto_id) { puesto = d; enterMain(); return; }
  } catch(e) {}
  loadPuestos();
}

async function loadPuestos() {
  showScreen('puestoScreen');
  try {
    var data = await api('GET', '/api/atencion/puestos?tipo=consultorio&activo=1');
    var list = data.puestos || [];
    var grid = document.getElementById('puestoGrid');
    grid.innerHTML = '';
    if (!list.length) { grid.innerHTML = '<p style="color:var(--ink4)">No hay consultorios disponibles</p>'; return; }
    list.forEach(function(p) {
      var b = document.createElement('button');
      b.className = 'puesto-btn';
      b.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>' + esc(p.nombre);
      b.onclick = function() { selectPuesto(p); };
      grid.appendChild(b);
    });
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function selectPuesto(p) {
  try {
    await api('POST', '/api/atencion/seleccionar-puesto', { puesto_id: p.id });
    puesto = p; enterMain();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

function enterMain() {
  showScreen('mainScreen');
  document.getElementById('hdrPuesto').textContent = puesto.nombre || 'Consultorio';
  document.getElementById('hdrUser').textContent = user ? (user.nombre || user.usuario || '') : '';
  startClock(); fetchCola(); startPolling(); connectSSE(); renderWorkspace();
}

/* ══════════════════════════════════════════
   QUEUE
   ══════════════════════════════════════════ */
async function fetchCola() {
  try {
    var data = await api('GET', '/api/atencion/cola');
    var prev = cola.length;
    cola = data.cola || [];
    if (data.actual !== undefined) {
      if (data.actual && !actual) {
        actual = data.actual;
        tryLoadExistingHC(actual.id);
      } else if (data.actual) {
        actual = data.actual;
      } else {
        actual = data.actual;
      }
    }
    if (cola.length > prev && prev > 0) playNotif();
    renderQueue();
  } catch(e) {}
}

function renderQueue() {
  var c = document.getElementById('queueList');
  document.getElementById('queueCount').textContent = cola.length;
  if (!cola.length) { c.innerHTML = '<div class="queue-empty">No hay pacientes en cola</div>'; return; }
  var order = { I:1, II:2, III:3, IV:4, V:5 };
  var sorted = cola.slice().sort(function(a, b) { return (order[a.triage_nivel] || 9) - (order[b.triage_nivel] || 9); });
  c.innerHTML = sorted.map(function(t) {
    var nv = t.triage_nivel || 'V';
    return '<div class="q-card">' +
      '<div class="q-turno">' + esc(t.turno) + '</div>' +
      '<div class="q-info">' +
        '<div class="q-name">' + esc(t.paciente_nombre || 'Paciente') + '</div>' +
        '<div class="q-meta">' +
          '<span class="triage-badge triage-' + nv + '">' + nv + ' - ' + (TRIAGE[nv] ? TRIAGE[nv].label : nv) + '</span>' +
        '</div>' +
      '</div></div>';
  }).join('');
}

/* ══════════════════════════════════════════
   TRY LOAD EXISTING HC
   ══════════════════════════════════════════ */
async function tryLoadExistingHC(admisionId) {
  try {
    var data = await api('GET', '/api/hc/por-admision/' + admisionId);
    if (data && data.hc) {
      hcId = data.hc.id;
      hcData = data.hc;
    }
  } catch(e) { /* 404 = no HC yet */ }
}

/* ══════════════════════════════════════════
   CHECK HC STATE
   ══════════════════════════════════════════ */
async function checkHCState() {
  if (!actual) return;
  if (hcId) {
    showHCOpened();
    loadEvoluciones();
    loadOrdenes();
    loadInterconsultas();
    loadPrescripcionesFromHC();
    return;
  }
  try {
    var data = await api('GET', '/api/hc/por-admision/' + actual.id);
    if (data && data.hc) {
      hcId = data.hc.id;
      hcData = data.hc;
      showHCOpened();
      loadEvoluciones();
      loadOrdenes();
      loadInterconsultas();
      loadPrescripcionesFromHC();
    }
  } catch(e) { /* 404 = no HC yet, form stays visible */ }
}

    }

}

function renderTriageSummary(t) {
  var el = document.getElementById('triageSummary');
  if (!el) return;
  var nv = t.nivel_asignado || '?';
  var color = TRIAGE[nv] ? TRIAGE[nv].color : 'var(--ink3)';
  var glasgowLabel = t.glasgow_total <= 8 ? 'Severo' : t.glasgow_total <= 12 ? 'Moderado' : 'Normal';

  var html = '<div class="triage-summary">';
  html += '<div class="triage-stat" style="border:2px solid ' + color + '"><div class="triage-stat-value" style="color:' + color + '">' + nv + '</div><div class="triage-stat-label">' + (TRIAGE[nv] ? TRIAGE[nv].label : '') + '</div></div>';
  if (t.ta_sistolica) html += '<div class="triage-stat"><div class="triage-stat-value">' + t.ta_sistolica + '/' + (t.ta_diastolica || '') + '</div><div class="triage-stat-label">T/A mmHg</div></div>';
  if (t.fc) html += '<div class="triage-stat"><div class="triage-stat-value">' + t.fc + '</div><div class="triage-stat-label">FC lpm</div></div>';
  if (t.fr) html += '<div class="triage-stat"><div class="triage-stat-value">' + t.fr + '</div><div class="triage-stat-label">FR rpm</div></div>';
  if (t.temperatura) html += '<div class="triage-stat"><div class="triage-stat-value">' + t.temperatura + '</div><div class="triage-stat-label">Temp C</div></div>';
  if (t.spo2 != null) html += '<div class="triage-stat"><div class="triage-stat-value">' + t.spo2 + '%</div><div class="triage-stat-label">SpO2</div></div>';
  if (t.glasgow_total != null) html += '<div class="triage-stat"><div class="triage-stat-value">' + t.glasgow_total + '/15</div><div class="triage-stat-label">Glasgow (' + glasgowLabel + ')</div></div>';
  if (t.eva_dolor != null) html += '<div class="triage-stat"><div class="triage-stat-value">' + t.eva_dolor + '/10</div><div class="triage-stat-label">EVA Dolor</div></div>';
  if (t.glucometria) html += '<div class="triage-stat"><div class="triage-stat-value">' + t.glucometria + '</div><div class="triage-stat-label">Glucometria</div></div>';
  html += '</div>';

  var discs = [];
  if (t.disc_via_aerea) discs.push('Via aerea comprometida');
  if (t.disc_sangrado) discs.push('Sangrado activo');
  if (t.disc_dolor_toracico) discs.push('Dolor toracico');
  if (t.disc_alt_neurologica) discs.push('Alt. neurologica');
  if (t.disc_gestante) discs.push('Gestante');
  if (t.disc_menor_edad) discs.push('Menor de edad');
  if (t.disc_trauma_mayor) discs.push('Trauma mayor');
  if (t.disc_convulsiones) discs.push('Convulsiones');
  if (t.disc_fiebre_alta) discs.push('Fiebre alta');
  if (discs.length) {
    html += '<div style="margin-top:12px;padding:10px 14px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;">' +
      '<strong style="font-size:12px;color:var(--danger);">Discriminadores activos:</strong> ' +
      '<span style="font-size:13px;color:var(--ink2);">' + discs.join(', ') + '</span></div>';
  }

  if (t.motivo_consulta) html += '<div style="margin-top:12px;"><strong style="font-size:12px;color:var(--ink3);">Motivo:</strong> <span style="font-size:13px;">' + esc(t.motivo_consulta) + '</span></div>';
  if (t.alergias) html += '<div style="margin-top:6px;padding:8px 12px;background:#FEF2F2;border-radius:6px;"><strong style="font-size:12px;color:var(--danger);">Alergias:</strong> <span style="font-size:13px;">' + esc(t.alergias) + '</span></div>';
  if (t.notas_enfermeria) html += '<div style="margin-top:6px;"><strong style="font-size:12px;color:var(--ink3);">Notas enfermeria:</strong> <span style="font-size:13px;">' + esc(t.notas_enfermeria) + '</span></div>';
  if (t.enfermera_nombre) html += '<div style="margin-top:8px;font-size:11px;color:var(--ink4);">Enfermera: ' + esc(t.enfermera_nombre) + '</div>';

  el.innerHTML = html;
}

/* ══════════════════════════════════════════
   TAB SWITCHING
   ══════════════════════════════════════════ */
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('active'); });
  var btn = document.querySelector('.tab-btn[data-tab="' + tab + '"]');
  if (btn) btn.classList.add('active');
  var paneMap = { triage:'tabTriage', hc:'tabHc', ordenes:'tabOrdenes', ic:'tabIc', rx:'tabRx', egreso:'tabEgreso' };
  var pane = document.getElementById(paneMap[tab]);
  if (pane) pane.classList.add('active');

  /* Lazy-load data when switching */
  if (tab === 'ordenes' && hcId) loadOrdenes();
  if (tab === 'ic' && hcId) loadInterconsultas();
  if (tab === 'rx') loadPrescripcionesFromHC();
  if (!hcId && (tab === 'ordenes' || tab === 'ic' || tab === 'rx')) showNoHC();
}

  var tad = document.getElementById('svTAD').value; if (tad) sv.ta_diastolica = Number(tad);

    });
    toast('Evolucion guardada correctamente', 'success');

    });

  } catch(e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    setBtn(btn, false, 'Guardar evolucion');
  }
}

async function loadEvoluciones() {
  if (!hcId) return;
  var el = document.getElementById('evolList');
  if (!el) return;
  try {
    var data = await api('GET', '/api/hc/' + hcId + '/evoluciones');
    var evols = data.evoluciones || [];
    if (!evols.length) { el.innerHTML = '<div class="list-empty">No hay evoluciones registradas</div>'; return; }
    el.innerHTML = evols.map(function(ev) {
      var h = '<div class="evol-entry"><div class="evol-entry-header">' +
        '<div class="evol-entry-time">' + esc(ev.tipo || 'Evolucion') + ' - ' + fmtDateTime(ev.created_at || ev.fecha) + '</div>' +
        '<div class="evol-entry-doctor">' + esc(ev.medico_nombre || ev.usuario_nombre || '') + '</div></div>';
      h += '<div class="evol-entry-body">';
      if (ev.enfermedad_actual) h += '<p><strong>Enfermedad actual:</strong> ' + esc(ev.enfermedad_actual) + '</p>';
      if (ev.examen_fisico) h += '<p><strong>Examen fisico:</strong> ' + esc(ev.examen_fisico) + '</p>';
      if (ev.analisis) h += '<p><strong>Analisis:</strong> ' + esc(ev.analisis) + '</p>';
      if (ev.plan_terapeutico) h += '<p><strong>Plan terapeutico:</strong> ' + esc(ev.plan_terapeutico) + '</p>';
      if (ev.cod_cie10) h += '<p><strong>CIE-10:</strong> ' + esc(ev.cod_cie10) + '</p>';
      var sv = ev.signos_vitales_json || ev.signos_vitales || {};
      if (typeof sv === 'string') { try { sv = JSON.parse(sv); } catch(e) { sv = {}; } }
      if (sv.ta_sistolica || sv.fc || sv.fr || sv.temperatura || sv.spo2) {
        h += '<p><strong>Signos vitales:</strong> ';
        var parts = [];
        if (sv.ta_sistolica) parts.push('TA ' + sv.ta_sistolica + '/' + (sv.ta_diastolica || '-'));
        if (sv.fc) parts.push('FC ' + sv.fc);
        if (sv.fr) parts.push('FR ' + sv.fr);
        if (sv.temperatura) parts.push('T ' + sv.temperatura + 'C');
        if (sv.spo2) parts.push('SpO2 ' + sv.spo2 + '%');
        h += parts.join(' | ') + '</p>';
      }
      h += '</div></div>';
      return h;
    }).join('');
  } catch(e) {
    el.innerHTML = '<div class="list-empty">Error al cargar evoluciones</div>';
  }
}

async function crearOrden() {
  if (!hcId) { toast('Debe abrir la HC primero', 'error'); return; }

  var nombre = document.getElementById('ordNombre').value.trim();
  if (!tipo) { toast('Seleccione el tipo de orden', 'error'); return; }
  if (!nombre) { toast('Nombre del estudio es requerido', 'error'); document.getElementById('ordNombre').focus(); return; }

  var prioridad = 'rutina';
  document.querySelectorAll('input[name="ordPrioridad"]').forEach(function(r) { if (r.checked) prioridad = r.value; });

  var btn = document.getElementById('btnCrearOrden');
  setBtn(btn, true, 'Creando...');
  try {
    await api('POST', '/api/ordenes/crear', {
      hc_id: hcId,
      admision_id: actual.id,
      paciente_id: actual.paciente_id,
      tipo_orden: tipo,
      nombre_estudio: nombre,
      cod_cups: document.getElementById('ordCups').value,

    });

    });

  } catch(e) {
    toast('Error: ' + e.message, 'error');

    setBtn(btn, false, 'Crear orden');
  }
}

async function verResultados(ordenId) {
  try {
    var data = await api('GET', '/api/ordenes/' + ordenId + '/resultados');
    var resultados = data.resultados || [];
    if (!resultados.length) { toast('No hay resultados disponibles aun', 'info'); return; }

      return (r.parametro || r.nombre || 'Resultado') + ': ' + (r.valor || '') + ' ' + (r.unidad || '') + (r.referencia ? ' (Ref: ' + r.referencia + ')' : '');

    alert('Resultados de la orden #' + ordenId + ':\n\n' + msg);

    toast('Error al cargar resultados: ' + e.message, 'error');

}

   PRESCRIPCIONES
   ══════════════════════════════════════════ */
function agregarRx() {
  var med = document.getElementById('rxMedicamento').value.trim();
  var dosis = document.getElementById('rxDosis').value.trim();
  var freq = document.getElementById('rxFrecuencia').value.trim();
  if (!med) { toast('El medicamento es requerido', 'error'); document.getElementById('rxMedicamento').focus(); return; }
  if (!dosis) { toast('La dosis es requerida', 'error'); document.getElementById('rxDosis').focus(); return; }
  if (!freq) { toast('La frecuencia es requerida', 'error'); document.getElementById('rxFrecuencia').focus(); return; }

  var rx = {
    medicamento: med,
    concentracion: document.getElementById('rxConcentracion').value,
    forma_farmaceutica: document.getElementById('rxForma').value,
    via_administracion: document.getElementById('rxVia').value,
    dosis: dosis,
    frecuencia: freq,
    duracion_dias: document.getElementById('rxDuracion').value,
    cantidad_total: document.getElementById('rxCantidad').value,
    cod_cum: document.getElementById('rxCum').value,
    indicaciones: document.getElementById('rxIndicaciones').value,
    _local: true,
    _time: new Date().toISOString()
  };

  localPrescripciones.push(rx);
  toast('Prescripcion agregada', 'success');

  ['rxMedicamento','rxConcentracion','rxDosis','rxFrecuencia','rxDuracion','rxCantidad','rxCum','rxIndicaciones'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.value = '';
  });

  renderPrescripciones();
}

async function loadPrescripcionesFromHC() {
  if (!hcId) { renderPrescripciones(); return; }
  try {
    var data = await api('GET', '/api/hc/' + hcId);
    if (data && data.prescripciones && data.prescripciones.length) {
      /* Merge server prescripciones (don't duplicate locals) */
      var serverRx = data.prescripciones;
      renderPrescripciones(serverRx);
      return;
    }
  } catch(e) { /* no endpoint or no prescripciones field */ }
  renderPrescripciones();
}

function renderPrescripciones(serverRx) {
  var el = document.getElementById('rxList');
  if (!el) return;
  var all = (serverRx || []).concat(localPrescripciones);
  if (!all.length) { el.innerHTML = '<div class="list-empty">No hay prescripciones registradas</div>'; return; }

  var h = '<div style="overflow-x:auto;"><table class="rx-table"><thead><tr>' +
    '<th>Medicamento</th><th>Dosis</th><th>Via</th><th>Frecuencia</th><th>Duracion</th><th>Indicaciones</th></tr></thead><tbody>';
  all.forEach(function(rx) {
    h += '<tr>' +
      '<td class="rx-med">' + esc(rx.medicamento) + (rx.concentracion ? '<br><span style="font-weight:400;color:var(--ink3);font-size:12px;">' + esc(rx.concentracion) + ' - ' + esc(rx.forma_farmaceutica || '') + '</span>' : '') + '</td>' +
      '<td>' + esc(rx.dosis || '') + '</td>' +
      '<td>' + esc(rx.via_administracion || '') + '</td>' +
      '<td>' + esc(rx.frecuencia || '') + '</td>' +
      '<td>' + (rx.duracion_dias ? esc(rx.duracion_dias) + ' dias' : '-') + '</td>' +
      '<td>' + esc(rx.indicaciones || '-') + '</td>' +
      '</tr>';
  });
  h += '</tbody></table></div>';
  if (localPrescripciones.length > 0) {
    h += '<div style="margin-top:8px;font-size:11px;color:var(--ink4);">Las prescripciones locales se guardaran al completar la atencion.</div>';
  }
  el.innerHTML = h;
}

function eliminarRx(idx) {
  localPrescripciones.splice(idx, 1);
  renderPrescripciones();
}

  if (!dx) { toast('El diagnostico de egreso es requerido', 'error'); document.getElementById('egresoDx').focus(); return; }

  try {
    await api('PUT', '/api/hc/' + hcId + '/diagnostico-egreso', {
      cod_cie10_egreso: dx,
      diagnosticos_relacionados: document.getElementById('egresoDxRel').value,
      condicion_egreso: document.getElementById('egresoCondicion').value,
      destino_egreso: document.getElementById('egresoDestino').value
    });
    toast('Diagnostico de egreso guardado', 'success');
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    setBtn(btn, false, 'Guardar diagnostico de egreso');
  }
}

async function cerrarHC() {
  if (!hcId) { toast('No hay HC abierta', 'error'); return; }
  if (!confirm('Esta seguro de cerrar la Historia Clinica? Esta accion no se puede deshacer.')) return;

  var btn = document.getElementById('btnCerrarHC');
  setBtn(btn, true, 'Cerrando...');
  try {
    await api('PUT', '/api/hc/' + hcId + '/cerrar', {});
    toast('Historia clinica cerrada', 'success');
    btn.disabled = true; btn.textContent = 'HC Cerrada';
  } catch(e) {
    toast('Error: ' + e.message, 'error');
    setBtn(btn, false, 'Cerrar Historia Clinica');
  }
}

async function completarAtencion() {
  if (!actual) return;
  var condicion = document.getElementById('egresoCondicion').value;
  var destino = document.getElementById('egresoDestino').value;
  if (!condicion || !destino) { toast('Seleccione condicion y destino de egreso', 'error'); return; }

  if (!confirm('Confirma completar la atencion del paciente?')) return;

  var btn = document.getElementById('btnAtendido');
  setBtn(btn, true, 'Completando...');
  try {
    /* Save egreso dx first if HC exists */
    if (hcId) {
      var dx = document.getElementById('egresoDx').value.trim();
      if (dx) {
        try {
          await api('PUT', '/api/hc/' + hcId + '/diagnostico-egreso', {
            cod_cie10_egreso: dx,
            diagnosticos_relacionados: document.getElementById('egresoDxRel').value,
            condicion_egreso: condicion,
            destino_egreso: destino
          });
        } catch(e) { /* continue anyway */ }
      }
    }

    /* Complete attention */
    await api('POST', '/api/atencion/accion', { id: actual.id });
    toast('Atencion completada correctamente', 'success');
    actual = null; triageData = null; hcId = null; hcData = null; localPrescripciones = [];
    await fetchCola();
    renderWorkspace();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
    setBtn(btn, false, 'Completar atencion');
  }
}

function imprimir(tipo) {
  if (!hcId) { toast('No hay HC abierta para imprimir', 'error'); return; }
  window.open('/api/impresion/' + tipo + '/' + hcId, '_blank');
}

/* ══════════════════════════════════════════
   PATIENT ACTIONS
   ══════════════════════════════════════════ */
async function callNext() {
  var btn = document.getElementById('btnNext');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try {
    var data = await api('POST', '/api/atencion/siguiente', {});
    actual = data.turno || data.actual || data;
    hcId = null; hcData = null; localPrescripciones = [];
    /* Try to load existing HC */
    await tryLoadExistingHC(actual.id);
    renderWorkspace();
    fetchCola();
  } catch(e) {
    toast(e.message || 'No hay pacientes en cola', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Llamar siguiente paciente'; }
  }
}

async function rellamar() {
  if (!actual) return;
  try {
    await api('POST', '/api/atencion/re-llamar', { id: actual.id });
    toast('Paciente re-llamado', 'info');
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function noPresento() {
  if (!actual) return;
  if (!confirm('Devolver paciente a la cola?')) return;
  try {
    await api('POST', '/api/atencion/devolver', { id: actual.id });
    toast('Paciente devuelto a cola', 'info');
    actual = null; hcId = null; hcData = null; localPrescripciones = [];
    renderWorkspace(); fetchCola();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

/* ══════════════════════════════════════════
   LOGOUT
   ══════════════════════════════════════════ */
document.getElementById('btnLogout').addEventListener('click', async function() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch(e) {}
  if (evtSource) evtSource.close();
  if (pollTimer) clearInterval(pollTimer);
  if (clockTimer) clearInterval(clockTimer);
  user = null; puesto = null; actual = null; cola = [];
  hcId = null; hcData = null; triageData = null; localPrescripciones = [];
  showScreen('loginScreen');
});

/* ══════════════════════════════════════════
   SSE + POLLING
   ══════════════════════════════════════════ */
function connectSSE() {
  if (evtSource) evtSource.close();
  var dot = document.getElementById('statusDot');
  try {
    var es = new EventSource('/api/sse');
    evtSource = es;
    es.onopen = function() { dot.classList.remove('disconnected'); };
    es.onerror = function() { dot.classList.add('disconnected'); };
    es.addEventListener('turno_admision', function() { playNotif(); fetchCola(); });
    es.addEventListener('turno_atendido', function() { fetchCola(); });
    es.addEventListener('orden_resultado', function() { if (activeTab === 'ordenes') loadOrdenes(); });
    es.addEventListener('interconsulta_respondida', function() { if (activeTab === 'ic') loadInterconsultas(); });
    es.onmessage = function(e) {
      try {
        var d = JSON.parse(e.data);
        if (d.tipo === 'turno_admision') { playNotif(); fetchCola(); }
        else if (d.tipo === 'turno_atendido' || d.tipo === 'turno_devuelto') fetchCola();
        else if (d.tipo === 'orden_resultado' && activeTab === 'ordenes') loadOrdenes();
        else if (d.tipo === 'interconsulta_respondida' && activeTab === 'ic') loadInterconsultas();
      } catch(ex) {}
    };
  } catch(e) { dot.classList.add('disconnected'); }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(fetchCola, 10000);
}

/* ══════════════════════════════════════════
   PUBLIC API
   ══════════════════════════════════════════ */
window.APP = {
  callNext: callNext,
  completarAtencion: completarAtencion,
  rellamar: rellamar,
  noPresento: noPresento,
  switchTab: switchTab,
  abrirHC: abrirHC,
  guardarEvolucion: guardarEvolucion,
  crearOrden: crearOrden,
  verResultados: verResultados,
  solicitarIC: solicitarIC,
  agregarRx: agregarRx,
  eliminarRx: eliminarRx,
  guardarEgresoDx: guardarEgresoDx,
  cerrarHC: cerrarHC,
  imprimir: imprimir
};

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */
(async function() {
  try {
    user = await api('GET', '/api/auth/me');
    await checkPuesto();
  } catch(e) {
    showScreen('loginScreen');
  }
})();

})();
</script>
