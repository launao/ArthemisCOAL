<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arthemis Health · COAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#FAF8F4;color:#1C1916;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrap{text-align:center;max-width:460px;padding:40px}
.logo{width:64px;height:64px;border-radius:16px;
  background:linear-gradient(145deg,#5147C4,#7269D8);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;margin-bottom:20px}
h1{font-size:24px;margin-bottom:8px}
p{font-size:14px;color:#6B6460;line-height:1.6;margin-bottom:28px}
.links{display:flex;flex-direction:column;gap:12px;align-items:center}
a{display:inline-block;padding:12px 28px;border-radius:12px;
  color:#fff;text-decoration:none;font-weight:600;font-size:14px;
  transition:all .2s;width:100%;max-width:280px;text-align:center}
a:hover{transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,#5147C4,#7269D8);
  box-shadow:0 6px 18px rgba(81,71,196,.25)}
.primary:hover{box-shadow:0 10px 26px rgba(81,71,196,.32)}
.secondary{background:#1C1916;box-shadow:0 4px 12px rgba(28,25,22,.15)}
.secondary:hover{box-shadow:0 8px 20px rgba(28,25,22,.2)}
.tertiary{background:#2D7A4F;box-shadow:0 4px 12px rgba(45,122,79,.2)}
.tertiary:hover{box-shadow:0 8px 20px rgba(45,122,79,.25)}
.version{margin-top:24px;font-size:11px;color:#A09890}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">A</div>
  <h1>Arthemis Health</h1>
  <p>Sistema de Información en Salud — Centro Ocular</p>
  <div class="links">
    <a href="/kiosco" class="primary">Abrir Kiosco</a>
    <a href="/kiosco/tv" class="secondary">Pantalla Sala de Espera</a>
    <a href="/kiosco/admin" class="tertiary">Panel Administrador</a>
  </div>
  <div class="version">v2.0 · ArthemisCOAL</div>
</div>
</body>
</html>
