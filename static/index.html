<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arthemis Health · COAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#FAF8F4;color:#1C1916;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrap{text-align:center;max-width:400px;padding:40px}
.logo{width:64px;height:64px;border-radius:16px;
  background:linear-gradient(145deg,#5147C4,#7269D8);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;margin-bottom:20px}
h1{font-size:24px;margin-bottom:8px}
p{font-size:14px;color:#6B6460;line-height:1.6;margin-bottom:24px}
a{display:inline-block;padding:12px 28px;border-radius:12px;
  background:linear-gradient(135deg,#5147C4,#7269D8);color:#fff;
  text-decoration:none;font-weight:600;font-size:14px;
  box-shadow:0 6px 18px rgba(81,71,196,.25);transition:all .2s}
a:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(81,71,196,.32)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">A</div>
  <h1>Arthemis Health</h1>
  <p>Sistema de Información en Salud — Centro Ocular</p>
  <a href="/kiosco">Abrir Kiosco</a>
</div>
</body>
</html>
