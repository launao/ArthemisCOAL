<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthemis Health — Gestión de Usuarios y Roles</title>
<style>
:root{--primary:#2E5D7A;--accent:#3A7A9B;--bg:#FAF9F5;--dark:#1A1A19;--white:#FFFFFF;--iv2:#F2EFE9;--line:#E6E1D8;--line2:#D8D2C7;--ink:#1A1A19;--ink2:#3D3834;--ink3:#6B6460;--ink4:#A09890;--success:#16A34A;--danger:#DC2626;--warning:#D97706}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.top-bar{background:var(--dark);color:var(--white);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-bar h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.top-bar .logo{width:28px;height:28px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.top-bar .nav-links{display:flex;gap:16px;align-items:center}
.top-bar .nav-links a{color:var(--white);text-decoration:none;font-size:13px;opacity:.8}
.top-bar .nav-links a:hover{opacity:1}
.content{padding:24px;max-width:1200px;margin:0 auto}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs button{background:none;border:none;padding:12px 24px;font-size:14px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-panel{display:none}
.tab-panel.active{display:block}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.toolbar .search{padding:8px 14px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:260px;background:var(--white)}
.toolbar .search:focus{outline:none;border-color:var(--primary)}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:var(--white)}
.btn-primary:hover{background:var(--accent)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn-outline:hover{background:var(--iv2)}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-danger:hover{opacity:.9}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);font-weight:600;color:var(--ink3);font-size:11px;text-transform:uppercase}
table td{padding:10px 12px;border-bottom:1px solid var(--line2)}
table tr:hover{background:var(--iv2)}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-ok{background:#dcfce7;color:#166534}
.badge-warn{background:#fefce8;color:#854d0e}
.badge-error{background:#fef2f2;color:#991b1b}
.badge-info{background:#eff6ff;color:#1e40af}
.badge-purple{background:#f3e8ff;color:#6b21a8}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:16px;padding:24px;max-width:560px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:4px;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.permisos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-height:240px;overflow-y:auto;padding:4px}
.perm-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px;border-radius:6px;cursor:pointer}
.perm-item:hover{background:var(--iv2)}
.perm-item input{accent-color:var(--primary)}
.perm-group-label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;margin:8px 0 4px;grid-column:1/-1;border-top:1px solid var(--line2);padding-top:8px}
.perm-group-label:first-child{border-top:none;padding-top:0;margin-top:0}
.status-active{color:var(--success)}
.status-inactive{color:var(--danger)}
.campo-row{display:grid;grid-template-columns:1fr 100px 80px 60px 60px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.campo-row:first-child{font-weight:600;color:var(--ink3);font-size:11px;text-transform:uppercase}
.toggle{position:relative;width:36px;height:20px;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--line);border-radius:20px;transition:.2s}
.toggle input:checked+.slider{background:var(--primary)}
.toggle .slider::before{content:'';position:absolute;height:16px;width:16px;left:2px;bottom:2px;background:white;border-radius:50%;transition:.2s}
.toggle input:checked+.slider::before{transform:translateX(16px)}
.no-data{text-align:center;padding:40px;color:var(--ink4)}
</style>
</head>
<body>
<div class="top-bar">
  <h1><img src="/static/logo_coal.png" alt="COAL" style="height:36px;border-radius:6px;vertical-align:middle;margin-right:8px"> Gestión de Usuarios y Roles</h1>
  <div class="nav-links">
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/">Inicio</a>
  </div>
</div>

<div class="content">
  <div class="tabs">
    <button class="active" data-tab="usuarios">Usuarios</button>
    <button data-tab="roles">Roles</button>
    <button data-tab="campos-hc">Campos HC</button>
    <button data-tab="campos-triage">Campos Triage</button>
  </div>

  <!-- ═══ USUARIOS ═══ -->
  <div class="tab-panel active" id="tab-usuarios">
    <div class="toolbar">
      <input class="search" placeholder="Buscar usuario..." id="searchUser" oninput="filterUsers()">
      <button class="btn btn-primary" onclick="showUserModal()">+ Nuevo Usuario</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Usuario</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Último Acceso</th><th>Acciones</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ═══ ROLES ═══ -->
  <div class="tab-panel" id="tab-roles">
    <div class="toolbar">
      <span style="font-size:14px;font-weight:600">Roles del Sistema</span>
      <button class="btn btn-primary" onclick="showRoleModal()">+ Nuevo Rol</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Nombre</th><th>Descripción</th><th>Permisos</th><th>Usuarios</th><th>Tipo</th><th>Acciones</th></tr></thead>
        <tbody id="rolesBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ═══ CAMPOS HC ═══ -->
  <div class="tab-panel" id="tab-campos-hc">
    <div class="toolbar">
      <span style="font-size:14px;font-weight:600">Campos Historia Clínica (Admin configurable)</span>
    </div>
    <div class="card" id="camposHcContainer"></div>
  </div>

  <!-- ═══ CAMPOS TRIAGE ═══ -->
  <div class="tab-panel" id="tab-campos-triage">
    <div class="toolbar">
      <span style="font-size:14px;font-weight:600">Campos Triage (Admin configurable)</span>
    </div>
    <div class="card" id="camposTriageContainer"></div>
  </div>
</div>

<!-- ═══ USER MODAL ═══ -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <h2 id="userModalTitle">Nuevo Usuario</h2>
    <input type="hidden" id="editUserId">
    <div class="form-group"><label>Usuario (login)</label><input id="fUsuario" placeholder="ej: dr_martinez"></div>
    <div class="form-group"><label>Nombre completo</label><input id="fNombre" placeholder="Dra. Andrea Martínez"></div>
    <div class="form-group"><label>Email</label><input id="fEmail" type="email" placeholder="email@clinic.co"></div>
    <div class="form-group"><label>Rol</label><select id="fRolId"></select></div>
    <div class="form-group" id="fPassGroup"><label>Contraseña (min 8, 1 mayúscula, 1 número)</label><input id="fPassword" type="password" placeholder="••••••••"></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('userModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveUser()">Guardar</button>
    </div>
  </div>
</div>

<!-- ═══ ROLE MODAL ═══ -->
<div class="modal-overlay" id="roleModal">
  <div class="modal">
    <h2 id="roleModalTitle">Nuevo Rol</h2>
    <input type="hidden" id="editRoleId">
    <div class="form-group"><label>Nombre del Rol</label><input id="rNombre" placeholder="ej: Coordinador"></div>
    <div class="form-group"><label>Descripción</label><input id="rDesc" placeholder="Descripción del rol"></div>
    <div class="form-group">
      <label>Permisos</label>
      <div class="permisos-grid" id="permisosGrid"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('roleModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveRole()">Guardar</button>
    </div>
  </div>
</div>

<!-- ═══ CAMPO EDIT MODAL ═══ -->
<div class="modal-overlay" id="campoModal">
  <div class="modal">
    <h2>Editar Campo</h2>
    <input type="hidden" id="cModulo"><input type="hidden" id="cCampo">
    <div class="form-group"><label>Etiqueta</label><input id="cEtiqueta"></div>
    <div class="form-group"><label>Tipo</label>
      <select id="cTipo"><option>text</option><option>textarea</option><option>number</option><option>select</option><option>checkbox</option><option>range</option></select>
    </div>
    <div class="form-group"><label>Ayuda</label><input id="cAyuda"></div>
    <div style="display:flex;gap:16px">
      <div class="form-group" style="flex:1"><label>Requerido</label><select id="cRequerido"><option value="1">Sí</option><option value="0">No</option></select></div>
      <div class="form-group" style="flex:1"><label>Visible</label><select id="cVisible"><option value="1">Sí</option><option value="0">No</option></select></div>
      <div class="form-group" style="flex:1"><label>Orden</label><input id="cOrden" type="number"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('campoModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCampo()">Guardar</button>
    </div>
  </div>
</div>

<script>
const API = '';
let allUsers = [], allRoles = [], permsCatalog = [];

async function checkAuth() {
  const r = await fetch(API+'/api/auth/me');
  const d = await r.json();
  if (!d.autenticado) { window.location.href='/'; return; }
  loadAll();
}

async function loadAll() {
  await Promise.all([loadUsers(), loadRoles(), loadPermsCatalog()]);
}

// ── Tab switching ──
document.querySelector('.tabs').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('tab-'+e.target.dataset.tab).classList.add('active');
  if (e.target.dataset.tab === 'campos-hc') loadCampos('hc');
  if (e.target.dataset.tab === 'campos-triage') loadCampos('triage');
});

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ═══ USERS ═══
async function loadUsers() {
  const r = await fetch(API+'/api/admin/usuarios');
  const d = await r.json();
  allUsers = d.usuarios || [];
  renderUsers(allUsers);
}

function filterUsers() {
  const q = document.getElementById('searchUser').value.toLowerCase();
  renderUsers(allUsers.filter(u => (u.usuario+u.nombre+u.email+u.rol_nombre).toLowerCase().includes(q)));
}

function renderUsers(users) {
  const body = document.getElementById('usersBody');
  if (!users.length) { body.innerHTML = '<tr><td colspan="7" class="no-data">Sin usuarios</td></tr>'; return; }
  body.innerHTML = users.map(u => `
    <tr>
      <td style="font-weight:600">${u.usuario}</td>
      <td>${u.nombre||''}</td>
      <td style="color:var(--ink3)">${u.email||''}</td>
      <td><span class="badge badge-purple">${u.rol_nombre||'-'}</span></td>
      <td>${u.activo ? '<span class="status-active">Activo</span>' : '<span class="status-inactive">Inactivo</span>'}</td>
      <td style="font-size:11px;color:var(--ink4)">${u.ultimo_acceso ? new Date(u.ultimo_acceso).toLocaleString('es-CO') : 'Nunca'}</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editUser(${u.id})">Editar</button>
        ${u.activo ? `<button class="btn btn-sm btn-danger" onclick="deactivateUser(${u.id},'${u.usuario}')">Desactivar</button>` : ''}
      </td>
    </tr>`).join('');
}

function showUserModal(user) {
  document.getElementById('userModalTitle').textContent = user ? 'Editar Usuario' : 'Nuevo Usuario';
  document.getElementById('editUserId').value = user ? user.id : '';
  document.getElementById('fUsuario').value = user ? user.usuario : '';
  document.getElementById('fUsuario').disabled = !!user;
  document.getElementById('fNombre').value = user ? user.nombre||'' : '';
  document.getElementById('fEmail').value = user ? user.email||'' : '';
  document.getElementById('fPassword').value = '';
  document.getElementById('fPassGroup').style.display = user ? 'none' : '';
  // Fill role select
  const sel = document.getElementById('fRolId');
  sel.innerHTML = allRoles.map(r => `<option value="${r.id}" ${user && user.rol_id==r.id?'selected':''}>${r.nombre}</option>`).join('');
  document.getElementById('userModal').classList.add('show');
}

async function editUser(id) {
  const user = allUsers.find(u => u.id === id);
  if (user) showUserModal(user);
}

async function saveUser() {
  const id = document.getElementById('editUserId').value;
  const data = {
    usuario: document.getElementById('fUsuario').value.trim(),
    nombre: document.getElementById('fNombre').value.trim(),
    email: document.getElementById('fEmail').value.trim(),
    rol_id: parseInt(document.getElementById('fRolId').value),
  };
  if (!id) data.password = document.getElementById('fPassword').value;

  const url = id ? `${API}/api/admin/usuarios/${id}` : `${API}/api/admin/usuarios`;
  const method = id ? 'PUT' : 'POST';
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  closeModal('userModal');
  loadUsers();
}

async function deactivateUser(id, name) {
  if (!confirm(`¿Desactivar usuario "${name}"?`)) return;
  const r = await fetch(`${API}/api/admin/usuarios/${id}`, {method:'DELETE'});
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  loadUsers();
}

// ═══ ROLES ═══
async function loadRoles() {
  const r = await fetch(API+'/api/admin/roles');
  const d = await r.json();
  allRoles = d.roles || [];
  renderRoles(allRoles);
}

function renderRoles(roles) {
  const body = document.getElementById('rolesBody');
  if (!roles.length) { body.innerHTML = '<tr><td colspan="6" class="no-data">Sin roles</td></tr>'; return; }
  body.innerHTML = roles.map(r => {
    const perms = r.permisos_list || [];
    const permBadges = perms.slice(0,4).map(p => `<span class="badge badge-info" style="margin:1px">${p}</span>`).join('') +
      (perms.length > 4 ? `<span class="badge badge-warn" style="margin:1px">+${perms.length-4}</span>` : '');
    return `<tr>
      <td style="font-weight:600">${r.nombre}</td>
      <td style="max-width:250px;font-size:12px;color:var(--ink3)">${r.descripcion||''}</td>
      <td>${permBadges}</td>
      <td style="text-align:center;font-weight:600">${r.usuario_count||0}</td>
      <td>${r.es_sistema ? '<span class="badge badge-info">Sistema</span>' : '<span class="badge badge-ok">Custom</span>'}</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editRole(${r.id})">Editar</button>
        ${!r.es_sistema ? `<button class="btn btn-sm btn-danger" onclick="deleteRole(${r.id},'${r.nombre}')">Eliminar</button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

async function loadPermsCatalog() {
  const r = await fetch(API+'/api/admin/permisos-catalogo');
  const d = await r.json();
  permsCatalog = d.catalogo || [];
}

function showRoleModal(role) {
  document.getElementById('roleModalTitle').textContent = role ? 'Editar Rol' : 'Nuevo Rol';
  document.getElementById('editRoleId').value = role ? role.id : '';
  document.getElementById('rNombre').value = role ? role.nombre : '';
  document.getElementById('rDesc').value = role ? role.descripcion||'' : '';

  const currentPerms = role ? (role.permisos_list || []) : [];
  const grid = document.getElementById('permisosGrid');
  let lastGroup = '';
  grid.innerHTML = permsCatalog.map(p => {
    let groupHtml = '';
    if (p.group !== lastGroup) { lastGroup = p.group; groupHtml = `<div class="perm-group-label">${p.group}</div>`; }
    return groupHtml + `<label class="perm-item"><input type="checkbox" value="${p.key}" ${currentPerms.includes(p.key)?'checked':''}> ${p.label}</label>`;
  }).join('');

  document.getElementById('roleModal').classList.add('show');
}

async function editRole(id) {
  const role = allRoles.find(r => r.id === id);
  if (role) showRoleModal(role);
}

async function saveRole() {
  const id = document.getElementById('editRoleId').value;
  const permisos = Array.from(document.querySelectorAll('#permisosGrid input:checked')).map(cb => cb.value);
  const data = {
    nombre: document.getElementById('rNombre').value.trim(),
    descripcion: document.getElementById('rDesc').value.trim(),
    permisos,
  };

  const url = id ? `${API}/api/admin/roles/${id}` : `${API}/api/admin/roles`;
  const method = id ? 'PUT' : 'POST';
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  closeModal('roleModal');
  loadRoles();
}

async function deleteRole(id, name) {
  if (!confirm(`¿Eliminar rol "${name}"? Los usuarios con este rol quedarán sin acceso.`)) return;
  const r = await fetch(`${API}/api/admin/roles/${id}`, {method:'DELETE'});
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  loadRoles();
}

// ═══ CAMPOS ═══
async function loadCampos(modulo) {
  const r = await fetch(API+`/api/admin/campos/${modulo}`);
  const d = await r.json();
  const container = document.getElementById(modulo === 'hc' ? 'camposHcContainer' : 'camposTriageContainer');
  const campos = d.campos || [];
  if (!campos.length) { container.innerHTML = '<div class="no-data">Sin campos configurados</div>'; return; }

  // Group by section/grupo
  const groups = {};
  campos.forEach(c => {
    const g = c.seccion || c.grupo || 'general';
    if (!groups[g]) groups[g] = [];
    groups[g].push(c);
  });

  let html = '';
  for (const [group, fields] of Object.entries(groups)) {
    html += `<h3 style="font-size:13px;font-weight:700;color:var(--primary);margin:16px 0 8px;text-transform:uppercase">${group}</h3>`;
    html += '<div class="campo-row"><span>Campo</span><span>Tipo</span><span>Requerido</span><span>Visible</span><span></span></div>';
    fields.forEach(c => {
      html += `<div class="campo-row">
        <span>${c.etiqueta} <span style="font-size:10px;color:var(--ink4)">(${c.campo})</span></span>
        <span class="badge badge-info">${c.tipo}</span>
        <span>${c.requerido ? '<span class="badge badge-warn">Sí</span>' : 'No'}</span>
        <span>${c.visible ? '<span class="badge badge-ok">Sí</span>' : '<span class="badge badge-error">No</span>'}</span>
        <button class="btn btn-sm btn-outline" onclick="editCampo('${modulo}',${JSON.stringify(c).replace(/'/g,"\\'")})">Editar</button>
      </div>`;
    });
  }
  container.innerHTML = html;
}

function editCampo(modulo, campo) {
  if (typeof campo === 'string') campo = JSON.parse(campo);
  document.getElementById('cModulo').value = modulo;
  document.getElementById('cCampo').value = campo.campo;
  document.getElementById('cEtiqueta').value = campo.etiqueta || '';
  document.getElementById('cTipo').value = campo.tipo || 'text';
  document.getElementById('cAyuda').value = campo.ayuda || '';
  document.getElementById('cRequerido').value = campo.requerido ? '1' : '0';
  document.getElementById('cVisible').value = campo.visible ? '1' : '0';
  document.getElementById('cOrden').value = campo.orden || 0;
  document.getElementById('campoModal').classList.add('show');
}

async function saveCampo() {
  const modulo = document.getElementById('cModulo').value;
  const campo = document.getElementById('cCampo').value;
  const data = {
    etiqueta: document.getElementById('cEtiqueta').value.trim(),
    tipo: document.getElementById('cTipo').value,
    ayuda: document.getElementById('cAyuda').value.trim(),
    requerido: parseInt(document.getElementById('cRequerido').value),
    visible: parseInt(document.getElementById('cVisible').value),
    orden: parseInt(document.getElementById('cOrden').value),
  };
  const r = await fetch(`${API}/api/admin/campos/${modulo}/${campo}`, {
    method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
  });
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  closeModal('campoModal');
  loadCampos(modulo);
}

checkAuth();
</script>
</body>
