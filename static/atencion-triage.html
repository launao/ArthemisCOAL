<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthemis Health · Triage</title>
<style>
:root {
  --primary: #5147C4;
  --accent: #7269D8;
  --bg: #FAF8F4;
  --dark: #1C1916;
  --white: #FFFFFF;
  --iv2: #F2EFE9;
  --line: #E6E1D8;
  --line2: #D8D2C7;
  --ink: #1C1916;
  --ink2: #3D3834;
  --ink3: #6B6460;
  --ink4: #A09890;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --triage-i: #DC2626;
  --triage-ii: #EA580C;
  --triage-iii: #D97706;
  --triage-iv: #16A34A;
  --triage-v: #2563EB;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--bg); }
button, input, textarea, select { font-family: var(--font); }
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ===== SCREENS ===== */
.screen { display: none; width: 100%; height: 100%; }
.screen.active { display: flex; }

/* ===== LOGIN ===== */
#loginScreen {
  align-items: center; justify-content: center; background: var(--bg);
}
.login-card {
  background: var(--white); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 420px;
  border: 1px solid var(--line); box-shadow: 0 8px 40px rgba(28,25,22,.08);
}
.login-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; justify-content: center; }
.login-mark {
  width: 48px; height: 48px; border-radius: 14px;
  background: linear-gradient(145deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff;
}
.login-brand { font-size: 22px; font-weight: 700; color: var(--dark); }
.login-subtitle { text-align: center; color: var(--ink3); font-size: 14px; margin-bottom: 28px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 6px; }
.form-group input {
  width: 100%; padding: 12px 16px; border: 1px solid var(--line2); border-radius: 10px;
  font-size: 15px; background: var(--bg); transition: border-color .2s;
}
.form-group input:focus { border-color: var(--primary); }
.btn-primary {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background .2s, transform .1s;
}
.btn-primary:hover { background: var(--accent); }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.login-error {
  background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;
  padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
}

/* ===== PUESTO SELECTION ===== */
#puestoScreen { align-items: center; justify-content: center; flex-direction: column; }
.puesto-card {
  background: var(--white); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 520px;
  border: 1px solid var(--line); box-shadow: 0 8px 40px rgba(28,25,22,.08);
}
.puesto-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.puesto-desc { text-align: center; color: var(--ink3); font-size: 14px; margin-bottom: 28px; }
.puesto-list { display: flex; flex-direction: column; gap: 10px; }
.puesto-btn {
  padding: 16px 20px; border: 2px solid var(--line); border-radius: 14px;
  background: var(--white); cursor: pointer; display: flex; align-items: center; gap: 14px;
  transition: all .2s; font-size: 16px; font-weight: 600; color: var(--ink);
}
.puesto-btn:hover { border-color: var(--primary); background: rgba(81,71,196,.04); }
.puesto-btn .puesto-icon {
  width: 42px; height: 42px; border-radius: 12px; background: var(--iv2);
  display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}

/* ===== HEADER ===== */
.header {
  height: 64px; flex-shrink: 0; background: var(--dark); display: flex; align-items: center;
  justify-content: space-between; padding: 0 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}
.hdr-left { display: flex; align-items: center; gap: 12px; }
.hdr-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(145deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.hdr-brand { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .3px; }
.hdr-center { display: flex; align-items: center; gap: 10px; }
.hdr-puesto { font-size: 15px; font-weight: 600; color: #fff; }
.status-dot {
  width: 10px; height: 10px; border-radius: 50%; background: #22C55E;
  box-shadow: 0 0 6px rgba(34,197,94,.5); transition: background .3s;
}
.status-dot.disconnected { background: #EF4444; box-shadow: 0 0 6px rgba(239,68,68,.5); }
.hdr-right { display: flex; align-items: center; gap: 16px; }
.hdr-user { font-size: 13px; color: rgba(255,255,255,.7); font-weight: 500; }
.hdr-clock { font-size: 13px; color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; }
.btn-logout {
  padding: 7px 14px; border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
  background: transparent; color: rgba(255,255,255,.7); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.btn-logout:hover { background: rgba(255,255,255,.1); color: #fff; }

/* ===== MAIN LAYOUT ===== */
#mainScreen { flex-direction: column; }
.main-content { flex: 1; display: flex; min-height: 0; overflow: hidden; }

/* ===== LEFT PANEL - QUEUE ===== */
.panel-queue {
  width: 40%; border-right: 1px solid var(--line); background: var(--white);
  display: flex; flex-direction: column; overflow: hidden;
}
.queue-header {
  padding: 18px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.queue-title { font-size: 16px; font-weight: 700; color: var(--ink); }
.queue-count {
  background: var(--primary); color: #fff; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; min-width: 28px; text-align: center;
}
.queue-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.queue-list::-webkit-scrollbar { width: 6px; }
.queue-list::-webkit-scrollbar-track { background: transparent; }
.queue-list::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }
.queue-empty {
  flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column;
  color: var(--ink4); gap: 8px;
}
.queue-empty-icon { font-size: 40px; opacity: .4; }
.queue-empty-text { font-size: 14px; }

/* ===== QUEUE CARD ===== */
.q-card {
  padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--white); display: flex; align-items: center; gap: 14px;
  transition: all .2s; cursor: default;
}
.q-card:hover { border-color: var(--line2); box-shadow: 0 2px 8px rgba(28,25,22,.06); }
.q-turno {
  font-size: 20px; font-weight: 800; color: var(--primary); min-width: 48px;
  letter-spacing: -.5px;
}
.q-info { flex: 1; min-width: 0; }
.q-name { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.q-badge {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  padding: 3px 8px; border-radius: 6px; white-space: nowrap;
}
.q-badge.preferencial { background: #FEF2F2; color: #DC2626; }
.q-badge.general { background: #FFFBEB; color: #B45309; }
.q-badge.cita { background: #F0FDF4; color: #16A34A; }
.q-time { font-size: 12px; color: var(--ink4); font-variant-numeric: tabular-nums; }

/* ===== RIGHT PANEL - PATIENT ===== */
.panel-patient {
  width: 60%; background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; overflow-y: auto; padding: 24px;
}

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.btn-siguiente {
  padding: 24px 56px; border: none; border-radius: 20px;
  background: var(--primary); color: #fff; font-size: 20px; font-weight: 700;
  cursor: pointer; transition: all .2s;
  box-shadow: 0 6px 24px rgba(81,71,196,.3);
}
.btn-siguiente:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(81,71,196,.4); }
.btn-siguiente:active { transform: translateY(0); }
.btn-siguiente:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.empty-hint { font-size: 14px; color: var(--ink4); }

/* Patient card */
.patient-card {
  background: var(--white); border-radius: 20px; border: 1px solid var(--line);
  box-shadow: 0 8px 40px rgba(28,25,22,.08); width: 100%; max-width: 640px;
  padding: 32px; animation: slideUp .3s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.pat-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.pat-turno {
  font-size: 32px; font-weight: 800; color: var(--primary); letter-spacing: -1px;
}
.pat-info { flex: 1; }
.pat-name { font-size: 20px; font-weight: 700; color: var(--ink); }
.pat-doc { font-size: 14px; color: var(--ink3); margin-top: 2px; }
.pat-badge {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  padding: 5px 12px; border-radius: 8px;
}

/* Triage levels */
.triage-section { margin-bottom: 24px; }
.triage-label { font-size: 14px; font-weight: 700; color: var(--ink2); margin-bottom: 12px; }
.triage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.triage-btn {
  padding: 16px 8px; border: 2px solid transparent; border-radius: 14px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
  transition: all .2s; background: transparent;
}
.triage-btn .t-level {
  width: 44px; height: 44px; border-radius: 12px; display: flex;
  align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff;
  transition: transform .2s;
}
.triage-btn .t-name { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.3; }
.triage-btn:hover .t-level { transform: scale(1.08); }
.triage-btn.selected { border-color: currentColor; background: rgba(0,0,0,.03); }

.triage-btn[data-nivel="1"] { color: var(--triage-i); }
.triage-btn[data-nivel="1"] .t-level { background: var(--triage-i); }
.triage-btn[data-nivel="2"] { color: var(--triage-ii); }
.triage-btn[data-nivel="2"] .t-level { background: var(--triage-ii); }
.triage-btn[data-nivel="3"] { color: var(--triage-iii); }
.triage-btn[data-nivel="3"] .t-level { background: var(--triage-iii); }
.triage-btn[data-nivel="4"] { color: var(--triage-iv); }
.triage-btn[data-nivel="4"] .t-level { background: var(--triage-iv); }
.triage-btn[data-nivel="5"] { color: var(--triage-v); }
.triage-btn[data-nivel="5"] .t-level { background: var(--triage-v); }

.notas-group { margin-bottom: 24px; }
.notas-group label { display: block; font-size: 14px; font-weight: 700; color: var(--ink2); margin-bottom: 8px; }
.notas-group textarea {
  width: 100%; height: 80px; padding: 12px 16px; border: 1px solid var(--line2);
  border-radius: 12px; font-size: 14px; background: var(--bg); resize: vertical;
}

.pat-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-asignar {
  flex: 1; min-width: 180px; padding: 14px 20px; border: none; border-radius: 12px;
  background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.btn-asignar:hover { background: var(--accent); }
.btn-asignar:disabled { opacity: .5; cursor: not-allowed; }
.btn-rellamar {
  padding: 14px 20px; border: 2px solid var(--line2); border-radius: 12px;
  background: var(--white); color: var(--ink2); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.btn-rellamar:hover { border-color: var(--primary); color: var(--primary); }
.btn-nopresento {
  padding: 14px 20px; border: 2px solid #FECACA; border-radius: 12px;
  background: #FEF2F2; color: #DC2626; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.btn-nopresento:hover { background: #FEE2E2; border-color: #FCA5A5; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 14px 22px;
  border-radius: 12px; color: #fff; font-size: 14px; font-weight: 600;
  transform: translateY(100px); opacity: 0; transition: all .3s; z-index: 1000;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: #16A34A; }
.toast.error { background: #DC2626; }
.toast.info { background: var(--primary); }

/* ===== LOADING SPINNER ===== */
.spinner {
  width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .main-content { flex-direction: column; }
  .panel-queue { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--line); }
  .panel-patient { width: 100%; height: 60%; }
  .triage-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 600px) {
  .header { padding: 0 14px; }
  .hdr-brand { display: none; }
  .patient-card { padding: 20px; }
  .triage-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-mark">A</div>
      <div class="login-brand">Arthemis Health</div>
    </div>
    <div class="login-subtitle">Acceso al sistema de Triage</div>
    <div id="loginError" class="login-error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Iniciar sesión</button>
    </form>
  </div>
</div>

<!-- ===== PUESTO SELECTION SCREEN ===== -->
<div id="puestoScreen" class="screen">
  <div class="puesto-card">
    <div class="puesto-title">Seleccionar puesto</div>
    <div class="puesto-desc">Escoja el puesto de triage donde va a trabajar</div>
    <div id="puestoList" class="puesto-list"></div>
  </div>
</div>

<!-- ===== MAIN SCREEN ===== -->
<div id="mainScreen" class="screen">
  <div class="header">
    <div class="hdr-left">
      <div class="hdr-mark">A</div>
      <div class="hdr-brand">Arthemis Health</div>
    </div>
    <div class="hdr-center">
      <div class="status-dot" id="statusDot" title="Conectado"></div>
      <div class="hdr-puesto" id="hdrPuesto">Triage</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-user" id="hdrUser"></div>
      <div class="hdr-clock" id="hdrClock"></div>
      <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
    </div>
  </div>
  <div class="main-content">
    <!-- LEFT: Queue -->
    <div class="panel-queue">
      <div class="queue-header">
        <div class="queue-title">Cola de espera</div>
        <div class="queue-count" id="queueCount">0</div>
      </div>
      <div class="queue-list" id="queueList">
        <div class="queue-empty">
          <div class="queue-empty-icon">📋</div>
          <div class="queue-empty-text">No hay pacientes en espera</div>
        </div>
      </div>
    </div>
    <!-- RIGHT: Patient -->
    <div class="panel-patient" id="panelPatient">
      <!-- Empty state shown by default -->
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
(function() {
'use strict';

// ===== STATE =====
const state = {
  user: null,
  puesto: null,
  cola: [],
  actual: null,
  selectedNivel: null,
  sseConnected: false,
  eventSource: null,
  pollInterval: null,
  clockInterval: null
};

// ===== HELPERS =====
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    credentials: 'same-origin',
    ...opts
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || body.mensaje || `Error ${res.status}`);
  }
  return res.json();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3500);
}

function minutesAgo(dateStr) {
  if (!dateStr) return '—';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.max(0, Math.floor(diff / 60000));
  return m + 'm';
}

function badgeClass(tipo) {
  if (!tipo) return 'general';
  const t = tipo.toLowerCase();
  if (t === 'preferencial') return 'preferencial';
  if (t === 'cita') return 'cita';
  return 'general';
}

function badgeLabel(tipo) {
  if (!tipo) return 'General';
  const t = tipo.toLowerCase();
  if (t === 'preferencial') return 'Preferencial';
  if (t === 'cita') return 'Cita';
  return 'General';
}

// ===== SOUND =====
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

// ===== CLOCK =====
function startClock() {
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('hdrClock').textContent = h + ':' + m + ':' + s;
  }
  tick();
  state.clockInterval = setInterval(tick, 1000);
}

// ===== AUTH =====
async function checkAuth() {
  try {
    const data = await api('/api/auth/me');
    state.user = data;
    return true;
  } catch(e) { return false; }
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const data = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value,
        password: document.getElementById('password').value
      })
    });
    state.user = data.user || data;
    await checkPuesto();
  } catch(err) {
    errEl.textContent = err.message || 'Credenciales incorrectas';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
});

// ===== PUESTO =====
async function checkPuesto() {
  try {
    const data = await api('/api/atencion/mi-puesto');
    if (data && data.puesto_id) {
      state.puesto = data;
      enterMain();
      return;
    }
  } catch(e) {}
  await loadPuestos();
}

async function loadPuestos() {
  showScreen('puestoScreen');
  try {
    const data = await api('/api/atencion/puestos?tipo=triage&activo=1');
    const list = data.puestos || data || [];
    const container = document.getElementById('puestoList');
    container.innerHTML = '';
    if (list.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:var(--ink4);padding:20px;">No hay puestos de triage disponibles</div>';
      return;
    }
    list.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'puesto-btn';
      btn.innerHTML = '<div class="puesto-icon">🏥</div><span>' + escHtml(p.nombre || p.name || ('Triage ' + p.id)) + '</span>';
      btn.addEventListener('click', () => selectPuesto(p));
      container.appendChild(btn);
    });
  } catch(err) {
    toast('Error cargando puestos: ' + err.message, 'error');
  }
}

async function selectPuesto(p) {
  try {
    const data = await api('/api/atencion/seleccionar-puesto', {
      method: 'POST',
      body: JSON.stringify({ puesto_id: p.id })
    });
    state.puesto = data.puesto || data || p;
    enterMain();
  } catch(err) {
    toast('Error seleccionando puesto: ' + err.message, 'error');
  }
}

// ===== MAIN VIEW =====
function enterMain() {
  showScreen('mainScreen');
  const puestoName = state.puesto.nombre || state.puesto.name || 'Triage';
  document.getElementById('hdrPuesto').textContent = puestoName;
  const userName = state.user ? (state.user.nombre || state.user.name || state.user.usuario || '') : '';
  document.getElementById('hdrUser').textContent = userName;
  startClock();
  refreshCola();
  startPolling();
  connectSSE();
  renderPatientPanel();
}

// ===== QUEUE =====
async function refreshCola() {
  try {
    const data = await api('/api/atencion/cola');
    const prevCount = state.cola.length;
    state.cola = data.cola || [];
    if (data.actual !== undefined) {
      state.actual = data.actual;
    }
    if (state.cola.length > prevCount && prevCount > 0) {
      playBeep();
    }
    renderQueue();
    renderPatientPanel();
  } catch(err) {
    console.error('Error refreshing cola:', err);
  }
}

function renderQueue() {
  const container = document.getElementById('queueList');
  const countEl = document.getElementById('queueCount');
  countEl.textContent = state.cola.length;

  if (state.cola.length === 0) {
    container.innerHTML = '<div class="queue-empty"><div class="queue-empty-icon">📋</div><div class="queue-empty-text">No hay pacientes en espera</div></div>';
    return;
  }

  container.innerHTML = '';
  state.cola.forEach(t => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.innerHTML =
      '<div class="q-turno">' + escHtml(t.turno || t.codigo || '—') + '</div>' +
      '<div class="q-info">' +
        '<div class="q-name">' + escHtml(t.paciente_nombre || t.nombre || 'Sin nombre') + '</div>' +
        '<div class="q-meta">' +
          '<span class="q-badge ' + badgeClass(t.turno_tipo) + '">' + badgeLabel(t.turno_tipo) + '</span>' +
          '<span class="q-time">' + minutesAgo(t.creado_en) + '</span>' +
        '</div>' +
      '</div>';
    container.appendChild(card);
  });
}

// ===== PATIENT PANEL =====
function renderPatientPanel() {
  const panel = document.getElementById('panelPatient');
  state.selectedNivel = null;

  if (!state.actual) {
    panel.innerHTML =
      '<div class="empty-state">' +
        '<button class="btn-siguiente" id="btnSiguiente" onclick="APP.siguiente()">Siguiente</button>' +
        '<div class="empty-hint">Presione para llamar al siguiente paciente</div>' +
      '</div>';
    const btn = document.getElementById('btnSiguiente');
    if (state.cola.length === 0) {
      btn.disabled = true;
    }
    return;
  }

  const p = state.actual;
  panel.innerHTML =
    '<div class="patient-card">' +
      '<div class="pat-header">' +
        '<div class="pat-turno">' + escHtml(p.turno || p.codigo || '—') + '</div>' +
        '<div class="pat-info">' +
          '<div class="pat-name">' + escHtml(p.paciente_nombre || p.nombre || 'Sin nombre') + '</div>' +
          '<div class="pat-doc">' + escHtml(p.documento || p.cedula || '—') + '</div>' +
        '</div>' +
        '<span class="pat-badge ' + badgeClass(p.turno_tipo) + '">' + badgeLabel(p.turno_tipo) + '</span>' +
      '</div>' +
      '<div class="triage-section">' +
        '<div class="triage-label">Nivel de Triage</div>' +
        '<div class="triage-grid">' +
          triageButton(1, 'I', 'Resucitación') +
          triageButton(2, 'II', 'Emergencia') +
          triageButton(3, 'III', 'Urgencia') +
          triageButton(4, 'IV', 'Prioritaria') +
          triageButton(5, 'V', 'No urgente') +
        '</div>' +
      '</div>' +
      '<div class="notas-group">' +
        '<label for="notasTriage">Notas</label>' +
        '<textarea id="notasTriage" placeholder="Observaciones del triage..."></textarea>' +
      '</div>' +
      '<div class="pat-actions">' +
        '<button class="btn-asignar" id="btnAsignar" onclick="APP.asignarTriage()" disabled>Asignar Triage</button>' +
        '<button class="btn-rellamar" onclick="APP.rellamar()">Re-llamar</button>' +
        '<button class="btn-nopresento" onclick="APP.noPresento()">No se presentó</button>' +
      '</div>' +
    '</div>';

  panel.querySelectorAll('.triage-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      panel.querySelectorAll('.triage-btn').forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');
      state.selectedNivel = parseInt(this.dataset.nivel);
      document.getElementById('btnAsignar').disabled = false;
    });
  });
}

function triageButton(nivel, roman, label) {
  return '<button type="button" class="triage-btn" data-nivel="' + nivel + '">' +
    '<div class="t-level">' + roman + '</div>' +
    '<div class="t-name">' + label + '</div>' +
  '</button>';
}

// ===== ACTIONS =====
async function siguiente() {
  const btn = document.getElementById('btnSiguiente');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try {
    const data = await api('/api/atencion/siguiente', { method: 'POST' });
    state.actual = data.turno || data.actual || data;
    renderPatientPanel();
    refreshCola();
  } catch(err) {
    toast(err.message || 'No hay pacientes en cola', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Siguiente'; }
  }
}

async function asignarTriage() {
  if (!state.actual || !state.selectedNivel) return;
  const btn = document.getElementById('btnAsignar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Asignando...';
  try {
    await api('/api/atencion/accion', {
      method: 'POST',
      body: JSON.stringify({
        id: state.actual.id,
        nivel: state.selectedNivel,
        notas: document.getElementById('notasTriage').value || ''
      })
    });
    toast('Triage nivel ' + state.selectedNivel + ' asignado', 'success');
    state.actual = null;
    state.selectedNivel = null;
    await refreshCola();
    // Auto-call next if there are patients waiting
    if (state.cola.length > 0) {
      await siguiente();
    } else {
      renderPatientPanel();
    }
  } catch(err) {
    toast('Error asignando triage: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Asignar Triage';
  }
}

async function rellamar() {
  if (!state.actual) return;
  try {
    await api('/api/atencion/re-llamar', {
      method: 'POST',
      body: JSON.stringify({ id: state.actual.id })
    });
    toast('Paciente re-llamado', 'info');
  } catch(err) {
    toast('Error: ' + err.message, 'error');
  }
}

async function noPresento() {
  if (!state.actual) return;
  try {
    await api('/api/atencion/devolver', {
      method: 'POST',
      body: JSON.stringify({ id: state.actual.id })
    });
    toast('Paciente devuelto a cola', 'info');
    state.actual = null;
    await refreshCola();
  } catch(err) {
    toast('Error: ' + err.message, 'error');
  }
}

// ===== LOGOUT =====
document.getElementById('btnLogout').addEventListener('click', async function() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch(e) {}
  cleanup();
  state.user = null;
  state.puesto = null;
  state.actual = null;
  state.cola = [];
  showScreen('loginScreen');
});

// ===== SSE =====
function connectSSE() {
  if (state.eventSource) { state.eventSource.close(); }
  const dot = document.getElementById('statusDot');
  try {
    const es = new EventSource('/api/sse');
    state.eventSource = es;
    es.onopen = function() {
      state.sseConnected = true;
      dot.classList.remove('disconnected');
      dot.title = 'Conectado';
    };
    es.onerror = function() {
      state.sseConnected = false;
      dot.classList.add('disconnected');
      dot.title = 'Desconectado - reconectando...';
    };
    es.addEventListener('nuevo_turno', function() { playBeep(); refreshCola(); });
    es.addEventListener('llamar_turno', function(e) {
      try {
        const d = JSON.parse(e.data);
        if (d.puesto_id === (state.puesto && state.puesto.id)) {
          state.actual = d.turno || d;
          renderPatientPanel();
        }
      } catch(ex) {}
      refreshCola();
    });
    es.addEventListener('triage_asignado', function() { refreshCola(); });
    es.addEventListener('turno_devuelto', function() { refreshCola(); });
    // Also handle generic message events
    es.onmessage = function(e) {
      try {
        const d = JSON.parse(e.data);
        if (d.tipo === 'nuevo_turno') { playBeep(); refreshCola(); }
        else if (d.tipo === 'llamar_turno') {
          if (d.puesto_id === (state.puesto && state.puesto.id)) {
            state.actual = d.turno || d;
            renderPatientPanel();
          }
          refreshCola();
        }
        else if (d.tipo === 'triage_asignado' || d.tipo === 'turno_devuelto') { refreshCola(); }
      } catch(ex) {}
    };
  } catch(e) {
    dot.classList.add('disconnected');
  }
}

// ===== POLLING =====
function startPolling() {
  if (state.pollInterval) clearInterval(state.pollInterval);
  state.pollInterval = setInterval(refreshCola, 10000);
}

function cleanup() {
  if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
  if (state.pollInterval) { clearInterval(state.pollInterval); state.pollInterval = null; }
  if (state.clockInterval) { clearInterval(state.clockInterval); state.clockInterval = null; }
}

function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== PUBLIC API =====
window.APP = { siguiente, asignarTriage, rellamar, noPresento };

// ===== INIT =====
(async function init() {
  const loggedIn = await checkAuth();
  if (loggedIn) {
    await checkPuesto();
  } else {
    showScreen('loginScreen');
  }
})();

})();
</script>
</body>
