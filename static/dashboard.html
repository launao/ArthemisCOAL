<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthemis Health — Redirigiendo...</title>
<link rel="stylesheet" href="/static/arthemis-theme.css">
<style>
body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#FAF9F5;color:#1A1A19}
.loading{text-align:center}
.loading h2{font-size:20px;margin-bottom:8px}
.loading p{color:#6B6460;font-size:14px}
</style>
</head>
<body>
<div class="loading">
  <h2>Arthemis Health</h2>
  <p>Cargando dashboard...</p>
</div>
<script>
(async()=>{
  try{
    const r=await fetch('/api/auth/me');
    const d=await r.json();
    if(!d.autenticado){window.location.href='/';return;}
    // Route based on permissions
    const p=d.permisos||[];
    if(p.includes('superadmin')||p.includes('director')){
      window.location.href='/admin/dashboard';
    } else if(p.includes('admin_usuarios')||p.includes('admin_roles')||p.includes('admin_sistema')){
      window.location.href='/admin/dashboard';
    } else if(p.includes('coord_medico')||p.includes('historia_clinica')){
      window.location.href='/admin/dashboard#medical';
    } else if(p.includes('coord_enfermeria')||p.includes('enfermeria')){
      window.location.href='/admin/dashboard#nursing';
    } else if(p.includes('coord_admisiones')||p.includes('admisiones')){
      window.location.href='/admin/dashboard#admissions';
    } else if(p.includes('coord_financiero')||p.includes('facturacion')){
      window.location.href='/admin/dashboard#finance';
    } else {
      window.location.href='/admin/dashboard';
    }
  }catch(e){window.location.href='/';}
})();
</script>

<!-- Theme Toggle -->
<button class="theme-toggle" onclick="(function(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);localStorage.setItem('arthemis-theme',t);})()" title="Cambiar tema">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
<script>
(function(){var t=localStorage.getItem('arthemis-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
</script>
</body>
</html>
